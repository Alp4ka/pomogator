[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pomogator"
version = "0.1.0"
description = "Telegram relocation helper with protected Notion content"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.21,<4",
  "aiohttp-socks>=0.10,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
pomogator-bot = "pomogator.polling:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/pomogator"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pomogator.main", "pomogator.presentation.api.routes", "pomogator.presentation.bot.handlers"]
disallow_untyped_defs = false
